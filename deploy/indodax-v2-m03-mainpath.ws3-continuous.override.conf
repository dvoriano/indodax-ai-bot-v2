# Install as zzzzz-ws3-continuous.conf in the original M03 drop-in dir.
# Same existing service, lock, database and timer; no second collector.
[Unit]
StartLimitIntervalSec=0

[Service]
Type=simple
ExecStart=
ExecStart=/usr/bin/flock -n %t/indodax-v2-m03-mainpath.lock %h/indodax-ai-bot-v2/.venv/bin/python -B -m indodax_ai_bot --m03-ws-summary-watch-once --m03-ws-observe-seconds 15 --m03-ws-microstructure-watch --db %h/indodax-ai-bot-v2/runtime/decisions.sqlite3
Environment=INDODAX_TRADING_ENABLED=NO
Environment=INDODAX_ALLOW_LIVE_EXECUTION=NO
Environment=INDODAX_EXECUTION_MODE=DRY_RUN
Environment=M03_WS3_TRADE_SAMPLES_GO=YES
Environment=M03_WS3_CONTINUOUS_GO=YES
Environment=M03_WS3_EVIDENCE_ARCHIVE_GO=YES
Environment=M03_WS3_MICRO_72H_ARCHIVE_GO=YES
UMask=0077
TimeoutStartSec=0
TimeoutStopSec=10s
Restart=always
RestartSec=2s
