# OPTIONAL ORIGINAL M03 service drop-in: SOURCE TEMPLATE ONLY.
#
# DO NOT install this file, change systemd or enable the M03 timer without
# independent explicit owner GO for this staging/configuration change.
# No private Indodax access, paid AI, trading or order authorization.
#
# Requires EXISTING dedicated V2 M05 owner SQLite and an operator-provisioned
# PRIVATE env file (0600, parent 0700), with NON-SECRET fields:
#   M05_MARKET_ADVISORY_QUEUE_GO=YES
#   M05_TELEGRAM_OWNER_DB=/absolute/path/to/existing/m05-owner.sqlite3
#   M05_TELEGRAM_OWNER_ID=<numeric real private Telegram owner id>
#
# Keep M05 Telegram token in its existing separate protected file. Never
# put a token or private exchange key in this env file or repository.
# Owner DB MUST already exist and identity must match; missing/mismatched
# owner DB, separate queue GO or file permissions fails BEFORE public scan.
#
# Existing M03 scanner cadence, flock lock, BTC WS DB, original journal,
# egress policy, no-private-order flags and trading disabled are unchanged.
# The SAME canonical %h/indodax-ai-bot-v2 source (no second M03 worktree).
# MANUAL mode means scanner/advisory may be scheduled while AUTO trades OFF.
[Service]
EnvironmentFile=%h/.config/indodax-ai-bot-v2/m03-m05-advisory.env
ExecStart=
ExecStart=/usr/bin/flock -n %t/indodax-v2-m03-mainpath.lock %h/indodax-ai-bot-v2/.venv/bin/python -B -m indodax_ai_bot --scheduled-public-scanner-once --bulk-deep-limit 20 --bulk-min-volume-idr 150000000 --ws-db %h/indodax-ai-bot-v2/runtime/public_ws_btc.sqlite3 --db %h/indodax-ai-bot-v2/runtime/decisions.sqlite3 --m05-shadow-db ${M05_TELEGRAM_OWNER_DB} --m05-shadow-owner-id ${M05_TELEGRAM_OWNER_ID} --m05-market-advisory-queue
Environment=INDODAX_TRADING_ENABLED=NO
Environment=INDODAX_ALLOW_LIVE_EXECUTION=NO
Environment=INDODAX_EXECUTION_MODE=DRY_RUN
