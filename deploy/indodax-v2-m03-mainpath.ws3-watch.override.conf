# Optional existing M03 user-service override; install ONLY under
# ~/.config/systemd/user/indodax-v2-m03-mainpath.service.d/
# zzzz-ws3-watch-only.conf. Never enable as a second service.
# Original REST+DEEP20 service is preserved on disk for rollback.
# Existing M03 timer and runtime/decisions.sqlite3 are reused.
# This is PUBLIC WS3 40s/min WATCH, not continuous socket, G1, or a trade.
[Service]
ExecStart=
ExecStart=/usr/bin/flock -n %t/indodax-v2-m03-mainpath.lock %h/indodax-ai-bot-v2/.venv/bin/python -B -m indodax_ai_bot --m03-ws-summary-watch-once --m03-ws-observe-seconds 40 --db %h/indodax-ai-bot-v2/runtime/decisions.sqlite3
TimeoutStartSec=70s
Restart=no
