# M10 STAGED ONLY: install to ~/.config/systemd/user/
# indodax-v2-public-ws-btc.service.d/90-capped-ops.conf
# Existing ExecStart stays the original CLI -> orchestrator -> supervised WS
# collector -> SQLite. This file introduces NO new scanner, WS writer or order.
[Service]
Restart=no
# Missing/expired owner PUBLIC-only GO, new gap, failure or 600s cooldown
# skips the original service before any new network request.
ExecCondition=%h/indodax-ai-bot-v2/.venv/bin/python -B %h/indodax-ai-bot-v2-m10-ops/indodax_ai_bot/btc_ops_gate.py check
# Preserve a fail-stop owner hold after an abnormal original service exit.
ExecStopPost=%h/indodax-ai-bot-v2/.venv/bin/python -B %h/indodax-ai-bot-v2-m10-ops/indodax_ai_bot/btc_ops_gate.py exit-hook
