permissions:
  contents: read

jobs:
  m07-original-no-order:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      INDODAX_TRADING_ENABLED: "NO"
      INDODAX_ALLOW_LIVE_EXECUTION: "NO"
      INDODAX_EXECUTION_MODE: "DRY_RUN"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify operator script Bash syntax
        run: |
          bash -n scripts/m07_readonly_once.sh
          bash -n scripts/m05_radar_owner_activate_once.sh
          bash -n scripts/m05_radar_postrollback_readonly.sh
          bash -n scripts/m05_strategy_a_priority_activate_once.sh
          bash -n scripts/m03_micro_72h_owner_enable_once.sh
          grep -Fq 'export INDODAX_TRADING_ENABLED=NO' scripts/m05_radar_owner_activate_once.sh
          grep -Fq 'export INDODAX_ALLOW_LIVE_EXECUTION=NO' scripts/m05_radar_owner_activate_once.sh
          grep -Fq 'export INDODAX_EXECUTION_MODE=DRY_RUN' scripts/m05_radar_owner_activate_once.sh
      - name: Original M03/M06/M07 source-bound integration + compatibility
        run: |
          python -m unittest -v \
            tests.test_m07_original_m03_m06_readonly_cycle \
            tests.test_m03_ws3_micro_research_archive_nonlive \
            tests.test_m03_micro_72h_owner_optin_nonlive \
            tests.test_m07_04_atomic_shadow_recovery_original \
            tests.test_m07_05_original_sell_ownership_guard \
            tests.test_m08_original_exchange_buy_admission \
            tests.test_m08_original_protective_exit \
            tests.test_m08_strategy_a_nonlive \
            tests.test_m08_strategy_a_durable_stop_nonlive \
            tests.test_m05_strategy_a_priority_preflight_readonly \
            tests.test_m05_strategy_a_priority_activate_nonlive \
            tests.test_m05_strategy_a_priority_receipts_readonly \
            tests.test_m05_strategy_a_four_ack_followup_readonly \
            tests.test_m05_strategy_a_asof_micro_risk_readonly \
            tests.test_m05_ws3_asof_quality_readonly \
            tests.test_m05_pitiden_premium_layout \
            tests.test_m05_pitiden_readiness_readonly \
            tests.test_m10_btc_self_heal \
            tests.test_m03_ws3_evidence_archive_nonlive \
            tests.test_m05_ws3_radar_bridge_nonlive \
            tests.test_m04_m05_ack_risk_handoff_nonlive \
            tests.test_m04_g1_15m_1h_source_inventory_nonlive \
            tests.test_m03_ws_summary_live_watch \
            tests.test_m04_g1_local_receipt_reconciliation_nonlive \
            tests.test_m04_g1_local_ack_windows_readonly \
            tests.test_m04_g1_ws3_chart_tick_probe_readonly \
            tests.test_m04_g1_chart_current_pair_preflight_readonly \
            tests.test_m04_g1_public_chart_activity_crosscheck_readonly \
            tests.test_m04_g1_v2_page_ws_signature_readonly \
            tests.test_m04_ws3_indexed_observation_nonlive \
            tests.test_m08_original_net_tier_exit \
            tests.test_m08_original_trade_time \
            tests.test_m08_original_sell_preflight \
            tests.test_m08_original_post_sell_rediscovery \
            tests.test_m09_01_original_shadow_mainpath \
            tests.test_m09_02_original_fault_chain \
            tests.test_m09_03_original_recovery_shadow \
            tests.test_m09_04_original_virtual_paper \
            tests.test_m09_ws3_watch_price_outcomes_readonly \
            tests.test_m04_ws3_watch_multicohort_readonly \
            tests.test_m04_ws3_watch_post400_collector_nonlive \
            tests.test_m07_readonly_runner_contract \
            tests.test_m07_main_idr_sourcebound_sizing_original \
            tests.test_m07_m06_m05_last_moment_mainpath
      - name: Validate one-shot operator capture shell syntax (no execution)
        run: bash -n scripts/m04_ws3_watch_cohort_capture_once.sh
      - name: Operator VPS explicit namespaced unittest regressions
        run: |
          python -B -m unittest -q \
            tests.test_m07_manual_lastmoment_source_join \
            tests.test_m08_original_exchange_buy_admission \
            tests.test_m05_owner_mode_inline \
            tests.test_m04_m05_telegram_ai_readiness
      - name: Exact VPS M05 fast longpoll and old 3s timer compatibility
        run: |
          python -B -m unittest -q \
            tests.test_m05_fast_longpoll_original \
            tests.test_m05_owner_mode_inline \
            tests.test_m05_telegram_service_tick
      - name: Existing original M03 continuation classification remains diagnostic
        run: |
          python -B -m unittest -q \
            tests.test_m03_scalping_evidence_continuation
