# OPTIONAL: install ONLY after the owner approves the M05 receiver switch.
# Same original service ID, bot ID, token file, cursor and owner DB.
# The original 3-second timer must first be disabled and stopped.
# No exchange BUY/SELL, paid AI or AUTO execution privileges are granted.
[Service]
Type=simple
Restart=on-failure
RestartSec=7s
TimeoutStopSec=15s
Environment=M05_TELEGRAM_FAST_LONGPOLL_GO=YES
# Refuse to start a long-poll worker while the old one-shot timer is active.
ExecCondition=/usr/bin/bash -c '! systemctl --user is-active --quiet indodax-v2-m05-telegram.timer'
